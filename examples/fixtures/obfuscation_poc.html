<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VoidCrawl masking PoC</title>
  <style>
    body { margin: 0; padding: 40px; font: 16px system-ui, sans-serif; background: #eef2ff; }
    form { width: 420px; padding: 24px; border-radius: 12px; background: white; box-shadow: 0 8px 30px #0002; }
    label { display: block; margin-top: 14px; font-weight: 650; }
    input { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #aab; border-radius: 6px; }
    #password { transition: transform 1.2s ease; }
    .hint { color: #556; margin-top: 18px; }
    .moving #password { transform: translateX(24px); }
  </style>
</head>
<body>
  <form id="login-form">
    <h1>Local masking PoC</h1>
    <label for="username">Username</label>
    <input id="username" autocomplete="username" value="demo-user">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" value="local-secret-123">
    <p class="hint">This instruction is intentionally visible; only the password field is masked.</p>
  </form>
  <script>
    setTimeout(() => document.body.classList.add('moving'), 1200);
  </script>
</body>
</html>
