# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[licenses]
# Licenses we explicitly allow
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "Zlib", # foldhash (via hashbrown ← cranelift ← yara-x); permissive, OSI/FSF-approved
]

# Confidence threshold — licenses detected below this are treated as unlicensed
confidence-threshold = 0.8

[bans]
# Deny crates with multiple conflicting versions
multiple-versions = "warn"
# Deny crates marked as wildcards in Cargo.toml
wildcards = "deny"
# Known-unresolvable duplicates pulled in by transitive deps
skip = [
    # getrandom: ring needs 0.2, rand needs 0.3, tempfile needs 0.4 — transitive, unresolvable
    { name = "getrandom" },
    # r-efi: pulled in by getrandom 0.3 and 0.4 at different versions — transitive
    { name = "r-efi" },
    # windows-sys: ring needs 0.52, tokio/tempfile ecosystem needs 0.61 — transitive
    { name = "windows-sys" },
]

[advisories]
# Warn on crates with known security vulnerabilities (requires cargo-deny 0.14+)
ignore = [
  # bincode 2.x flagged "unmaintained" — a transitive dep of yara-x (compiled-
  # rule serialization), not a vulnerability and not removable. Revisit if
  # yara-x drops it or a CVE lands.
  "RUSTSEC-2025-0141",

  # wasmtime "stores can mix up type indices between engines". Reached only via
  # yara-x, which embeds wasmtime to execute compiled YARA rules. We are already
  # on the newest yara-x (1.19.0) and it pins wasmtime 43.x, while the fix needs
  # 46/47 — so this is not resolvable here until yara-x bumps upstream.
  #
  # Not reachable in this codebase: the ruleset is the compile-time constant
  # `RULES_SRC` in crates/core/src/scanner.rs, never caller-supplied, so the
  # engine only ever runs WASM built from our own hardcoded rules. Exploiting
  # this requires attacker-controlled modules across multiple engines.
  # Remove this entry as soon as yara-x ships a wasmtime >=46.0.2.
  "RUSTSEC-2026-0222",

  # crossbeam invalid pointer dereference in the `fmt::Pointer` impl for
  # `Atomic`/`Shared`. A *build* dependency of yara-x, and it fires only when
  # formatting an already-invalid pointer — not reachable at runtime here.
  # Same removal condition: drop when yara-x updates the dependency.
  "RUSTSEC-2026-0204",
]

[sources]
# Only allow crates from crates.io (no unpublished git deps)
unknown-registry = "deny"
unknown-git = "deny"
