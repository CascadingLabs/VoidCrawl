# Rootless headful Chrome with Sway and an on-demand local noVNC viewer.
#
# Pick one GPU profile:
#   ./docker/run-headful.sh
#   COMPOSE_PROFILES=amd docker compose -f docker/docker-compose.headful.yml up
#
# The container uses host networking so Chrome's loopback-only CDP endpoints are
# reachable locally. It publishes no native-VNC or noVNC ports: websockify binds
# 127.0.0.1:VIEWER_NOVNC_PORT only while `docker/viewer.sh open` has a lease.

x-headful-base: &headful-base
  image: ${VOIDCRAWL_IMAGE:-voidcrawl-headful:local}
  build:
    context: ..
    dockerfile: docker/Dockerfile.headful
  user: "10001:10001"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true
  environment: &headful-env
    BROWSER_COUNT: "${BROWSER_COUNT:-2}"
    CDP_PORT_BASE: "${CDP_PORT_BASE:-19222}"
    TABS_PER_BROWSER: "${TABS_PER_BROWSER:-4}"
    TAB_MAX_USES: "${TAB_MAX_USES:-50}"
    TAB_MAX_IDLE_SECS: "${TAB_MAX_IDLE_SECS:-60}"
    CHROME_NO_SANDBOX: "1"
    # Default profiles are ephemeral and owned by UID 10001 under RUNTIME_DIR.
    # Set CHROME_PROFILES_DIR=/profiles only after preparing that volume for UID
    # 10001 (see docs/docker-headful.md).
    CHROME_PROFILES_DIR: "${CHROME_PROFILES_DIR:-/tmp/voidcrawl/profiles}"
    VNC_PORT_BASE: "${VNC_PORT_BASE:-5900}"
    VNC_WIDTH: "${VNC_WIDTH:-1920}"
    VNC_HEIGHT: "${VNC_HEIGHT:-1080}"
    VIEWER_MODE: "${VIEWER_MODE:-disabled}"
    VIEWER_NOVNC_PORT: "${VIEWER_NOVNC_PORT:-6080}"
    VIEWER_TTL: "${VIEWER_TTL:-15m}"
    VIEWER_MAX_FPS: "${VIEWER_MAX_FPS:-30}"
  # Chrome ignores --remote-debugging-address in recent versions and binds
  # localhost; host networking makes those local CDP endpoints usable.
  network_mode: host
  shm_size: "2gb"
  # A named volume is opt-in persistence only. The default profile path is not
  # this mount, so fresh rootless runs do not depend on its ownership.
  volumes:
    - voidcrawl-headful-profiles:/profiles
  # Hosts usually expose /dev/dri/renderD128 through the render group. Set
  # HOST_RENDER_GID=$(stat -c %g /dev/dri/renderD128) before GPU runs; CPU-only
  # safely falls back to the container user's own group.
  group_add:
    - "${HOST_RENDER_GID:-10001}"
  healthcheck:
    test: ["CMD", "/usr/local/bin/check-outputs.sh"]
    interval: 10s
    timeout: 5s
    start_period: 30s
    retries: 3

services:
  voidcrawl-cdp-amd:
    <<: *headful-base
    profiles: ["amd"]
    devices:
      - /dev/dri:/dev/dri

  voidcrawl-cdp-intel:
    <<: *headful-base
    profiles: ["intel"]
    devices:
      - /dev/dri:/dev/dri

  voidcrawl-cdp-nvidia:
    <<: *headful-base
    profiles: ["nvidia"]
    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  voidcrawl-cdp-cpu:
    <<: *headful-base
    profiles: ["cpu"]
    environment:
      <<: *headful-env
      WLR_RENDERER: "pixman"
      WLR_RENDERER_ALLOW_SOFTWARE: "1"

volumes:
  # To persist profiles, initialise this volume for UID:GID 10001:10001 first.
  voidcrawl-headful-profiles:
