name: Free-threaded Python canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-314t-canary:
    name: Experimental Python 3.14t canary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Set up experimental free-threaded Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14t"

      - name: Verify the GIL is disabled
        run: python -c "import sysconfig; assert sysconfig.get_config_var('Py_GIL_DISABLED') == 1"

      - name: Install dependencies and build extension
        run: uv sync --python 3.14t --group dev

      - name: Run experimental test suite
        env:
          CHROME_LAUNCH_TIMEOUT_SECS: "60"
        run: uv run --python 3.14t pytest tests/ -v

      - name: Build experimental wheel
        run: uv run --python 3.14t maturin build --release --manifest-path crates/pyo3_bindings/Cargo.toml --interpreter python3.14t

      - name: Verify free-threaded wheel tag
        run: python -c "from pathlib import Path; assert list(Path('target/wheels').glob('*cp314t*.whl'))"

      - name: Upload canary wheel artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: voidcrawl-python-314t-canary
          path: target/wheels/*cp314t*.whl
          if-no-files-found: error
