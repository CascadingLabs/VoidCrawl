# Dependency CVE gate — be proactive instead of waiting on Dependabot.
# Scanners live in CascadingLabs/.github (reusable workflows); update them once,
# every repo inherits the change. See that repo's .github/workflows/cve-*.yml.
# VoidCrawl is polyglot: Python (uv.lock) + Rust (Cargo.lock).

name: Security (CVE)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: CascadingLabs/.github/.github/workflows/cve-python.yml@main
  rust:
    uses: CascadingLabs/.github/.github/workflows/cve-rust.yml@main
  # No `js:` job: VoidCrawl ships no package.json or bun.lock, so the JS gate
  # had nothing to audit and failed the whole workflow on every run. Re-add it
  # if a JS lockfile is ever introduced.
